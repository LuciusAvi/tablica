<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Каталог книг</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background: #f4f4f9; }
        .controls { margin-bottom: 20px; display: flex; gap: 10px; }
        input, select { padding: 8px; font-size: 14px; }
        table { width: 100%; border-collapse: collapse; background: #fff; }
        th, td { padding: 10px; border: 1px solid #ddd; text-align: left; }
        th { background: #007bff; color: white; }
    </style>
</head>
<body>

    <h2>Каталог книг</h2>

    <div class="controls">
        <input type="text" id="searchInput" placeholder="Поиск по названию...">
        <select id="sortSelect">
            <option value="title-asc">Название (А-Я)</option>
            <option value="title-desc">Название (Я-А)</option>
            <option value="price-asc">Цена (по возрастанию)</option>
            <option value="price-desc">Цена (по убыванию)</option>
        </select>
    </div>

    <table>
        <thead>
            <tr>
                <th>Название</th>
                <th>Автор</th>
                <th>Цена</th>
                <th>Количество</th>
            </tr>
        </thead>
        <tbody id="booksTable"></tbody>
    </table>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

        const SUPABASE_URL = 'https://jxouqjeonvsmhuabevax.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_MCUHToGWHqly12-y8Z7kxA_ha79TfPm';
        const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        async function loadBooks() {
            const searchInput = document.getElementById('searchInput');
            const sortSelect = document.getElementById('sortSelect');
            const tbody = document.getElementById('booksTable');

            const search = searchInput ? searchInput.value : '';
            const [sortField, sortOrder] = sortSelect ? sortSelect.value.split('-') : ['title', 'asc'];

            let query = supabase
                .from('book')
                .select('title, price, amount, author(name_author)');

            if (search) {
                query = query.ilike('title', `%${search}%`);
            }

            query = query.order(sortField, { ascending: sortOrder === 'asc' });

            const { data, error } = await query;

            if (error) {
                console.error('Ошибка Supabase:', error);
                tbody.innerHTML = `<tr><td colspan="4" style="color:red">Ошибка загрузки: ${error.message}</td></tr>`;
                return;
            }

            tbody.innerHTML = '';

            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4">Записи не найдены</td></tr>';
                return;
            }

            data.forEach(book => {
                const authorName = book.author ? book.author.name_author : 'Не указан';
                const row = `<tr>
                    <td>${book.title || ''}</td>
                    <td>${authorName}</td>
                    <td>${book.price ? book.price + ' руб.' : '-'}</td>
                    <td>${book.amount ?? 0}</td>
                </tr>`;
                tbody.innerHTML += row;
            });
        }

        // Привязываем события слушателей
        document.getElementById('searchInput').addEventListener('input', loadBooks);
        document.getElementById('sortSelect').addEventListener('change', loadBooks);

        // Загружаем данные при открытии страницы
        loadBooks();
    </script>
</body>
</html>
