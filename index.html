<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог книг</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background: #f4f4f9; }
        .controls { margin-bottom: 20px; display: flex; gap: 10px; }
        input, select { padding: 8px; font-size: 14px; }
        table { width: 100%; border-collapse: collapse; background: #fff; }
        th, td { padding: 10px; border: 1px solid #ddd; text-align: left; }
        th { background: #007bff; color: white; }
    </style>
</head>
<body>

    <h2>Каталог книг</h2>

    <div class="controls">
        <input type="text" id="searchInput" placeholder="Поиск по названию или автору...">
        <select id="sortSelect">
            <option value="title-asc">Название (А-Я)</option>
            <option value="title-desc">Название (Я-А)</option>
            <option value="price-asc">Цена (по возрастанию)</option>
            <option value="price-desc">Цена (по убыванию)</option>
        </select>
    </div>

    <table>
        <thead>
            <tr>
                <th>Название</th>
                <th>Автор</th>
                <th>Цена</th>
                <th>Количество</th>
            </tr>
        </thead>
        <tbody id="booksTable"></tbody>
    </table>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

        const SUPABASE_URL = 'https://jxouqjeonvsmhuabevax.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp4b3VxamVvbnZzbWh1YWJldmF4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzNDEwNTMsImV4cCI6MjEwNjkxNzA1M30.SHVO2kQZDeSOziWDNwMkLOU4PmV2OPR0VjEKXh0GNR0';
        const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        let cachedData = []; // Кэш всех книг для мгновенной откликаемости
        let debounceTimer;   // Таймер для предотвращения лишних запросов

        async function fetchBooks() {
            const sortSelect = document.getElementById('sortSelect');
            const tbody = document.getElementById('booksTable');
            const [sortField, sortOrder] = sortSelect ? sortSelect.value.split('-') : ['title', 'asc'];

            let query = supabase
                .from('book')
                .select('title, price, amount, author!inner(name_author)')
                .order(sortField, { ascending: sortOrder === 'asc' });

            const { data, error } = await query;

            if (error) {
                console.error('Ошибка Supabase:', error);
                tbody.innerHTML = `<tr><td colspan="4" style="color:red">Ошибка загрузки: ${error.message}</td></tr>`;
                return;
            }

            cachedData = data || [];
            applyFilterAndRender();
        }

        function applyFilterAndRender() {
            const searchInput = document.getElementById('searchInput');
            const tbody = document.getElementById('booksTable');
            const search = searchInput ? searchInput.value.trim().toLowerCase() : '';

            if (!search) {
                renderTable(cachedData, tbody);
                return;
            }

            const filteredData = cachedData.filter(book => {
                const titleMatch = book.title && book.title.toLowerCase().includes(search);
                const authorMatch = book.author && book.author.name_author && book.author.name_author.toLowerCase().includes(search);
                return titleMatch || authorMatch;
            });

            renderTable(filteredData, tbody);
        }

        function renderTable(data, tbody) {
            tbody.innerHTML = '';

            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4">Ничего не найдено</td></tr>';
                return;
            }

            data.forEach(book => {
                const authorName = book.author ? book.author.name_author : 'Не указан';
                const row = `<tr>
                    <td>${book.title || ''}</td>
                    <td>${authorName}</td>
                    <td>${book.price ? book.price + ' руб.' : '-'}</td>
                    <td>${book.amount ?? 0}</td>
                </tr>`;
                tbody.innerHTML += row;
            });
        }

        // Обработчик поиска с мгновенным сбросом при полной очистке
        document.getElementById('searchInput').addEventListener('input', (e) => {
            clearTimeout(debounceTimer);
            if (e.target.value.trim() === '') {
                applyFilterAndRender(); // Мгновенно отображаем весь список без задержки
            } else {
                debounceTimer = setTimeout(applyFilterAndRender, 150); // Легкий дебаунс для оптимизации
            }
        });

        // При изменении сортировки запрашиваем обновленный список у сервера
        document.getElementById('sortSelect').addEventListener('change', fetchBooks);

        // Первоначальная загрузка
        fetchBooks();
    </script>
</body>
</html>
